name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install puyapy
        run: pip install puyapy
      - name: Compile vesting contract
        run: puyapy smart_contracts/vesting/contract.py --out-dir smart_contracts/artifacts/vesting --resource-encoding value
