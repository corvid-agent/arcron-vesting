name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static hook checks
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/ -q
      - name: Compile vesting contract
        run: puyapy smart_contracts/vesting/contract.py --out-dir smart_contracts/artifacts/vesting --resource-encoding value
